<!DOCTYPE html>
<html>

<head lang="en">
    <title>Container Toggle Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <!--
        Learn more about property inspector components at https://sdpi-components.dev/docs/components
    -->
    <sdpi-item label="SSH Host Alias">
        <sdpi-textfield setting="sshHost" placeholder="e.g. docker-server (from ~/.ssh/config)" required></sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="Container Name">
        <sdpi-textfield setting="containerName" placeholder="e.g. backend" required></sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="Confirm Before Stop">
        <sdpi-checkbox setting="confirmBeforeStop" default="true" checked>Require a second press before stopping a running container</sdpi-checkbox>
    </sdpi-item>

    <sdpi-item label="Refresh Interval (s)">
        <sdpi-range setting="refreshIntervalSeconds" min="2" max="60" step="1" default="5" showlabels></sdpi-range>
    </sdpi-item>

    <sdpi-item label="SSH Timeout (s)">
        <sdpi-range setting="sshTimeoutSeconds" min="2" max="30" step="1" default="10" showlabels></sdpi-range>
    </sdpi-item>

    <sdpi-item label="Show Health Status">
        <sdpi-checkbox setting="showHealth" default="true" checked>Show health status when available</sdpi-checkbox>
    </sdpi-item>

    <sdpi-item label="Show Uptime">
        <sdpi-checkbox setting="showUptime" default="true" checked>Show uptime when running</sdpi-checkbox>
    </sdpi-item>
</body>

</html>
